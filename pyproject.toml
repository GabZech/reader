[project]
name = "reader"
version = "0.1.0"
description = "Reader: a personal reading hub for one person."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn[standard]==0.35.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.33",
    "httpx==0.28.1",
    "feedparser==6.0.11",
    "trafilatura==2.2.0",
    "lxml==6.1.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "pytest==8.4.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
]
