ante-teaser_binary_178395-640x712.png","height":"712","mimeType":"image/png","width":"640","name":"FREE_640","__typename":"MediaSize"},{"sourceUrl":"https://nexo-uploads-beta.s3.amazonaws.com/wp-content/uploads/images/2023/12/11181114/colunista_filipecampante-teaser_binary_178395-560x350.png","height":"350","mimeType":"image/png","width":"560","name":"BASE_LANDSCAPE_SMALL","__typename":"MediaSize"},{"sourceUrl":"https://nexo-uploads-beta.s3.amazonaws.com/wp-content/uploads/images/2023/12/11181114/colunista_filipecampante-teaser_binary_178395-860x540.png","height":"540","mimeType":"image/png","width":"860","name":"BASE_PP_HOME","__typename":"MediaSize"},{"sourceUrl":"https://nexo-uploads-beta.s3.amazonaws.com/wp-content/uploads/images/2023/12/11181114/colunista_filipecampante-teaser_binary_178395-1138x344.png","height":"344","mimeType":"image/png","width":"1138","name":"BASE_PP_LEAD_QUESTION","__typename":"MediaSize"},{"sourceUrl":"https://nexo-uploads-beta.s3.amazonaws.com/wp-content/uploads/images/2023/12/11181114/colunista_filipecampante-teaser_binary_178395-360x225.png","height":"225","mimeType":"image/png","width":"360","name":"BASE_PP_LEAD_QUESTION_MOBILE","__typename":"MediaSize"}],"__typename":"MediaDetails"},"altText":"Filipe Campante","comments":{"edges":[],"__typename":"MediaItemToCommentConnection"},"imagesACF":{"agency":null,"photographer":null,"fieldGroupName":"imagesACF","thinLine":null,"__typename":"MediaItem_Imagesacf"},"__typename":"MediaItem"},"__typename":"NodeWithFeaturedImageToMediaItemConnectionEdge"},"author":"Filipe Campante","content":"\u003chtml\u003e\u003chead\u003e\u003c/head\u003e\u003cbody\u003e\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eA trágica saga da Venezuela ao longo das últimas décadas, em que o país foi destroçado pelo regime implantado sob a liderança do falecido Hugo Chávez e por muitos anos liderado por seu sucessor, Nicolás Maduro, adquire contornos cada vez mais farsescos.\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eDesde que uma intervenção militar dos Estados Unidos capturou Maduro e sua esposa e os levou para uma prisão em Nova York, o que parecia impensável aconteceu: o regime chavista continuou no poder intocado — para além, claro, da remoção do ex-líder —, exceto que agora opera, na prática, como um protetorado sob a tutela do governo norte-americano.\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003eO último episódio dessa bizarra saga foi o anúncio de uma\u003c/span\u003e\u003ca href=\"https://www.ft.com/content/2f88581f-4fbc-46a2-8127-830bb630c2f2?syn-25a6b1a6=1\"\u003e \u003cspan style=\"font-weight: 400;\"\u003e“parceria” entre os países\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"font-weight: 400;\"\u003e — anunciada por Donald Trump, com sua característica imodéstia, como “o maior negócio de petróleo da história”. Os detalhes são para lá de escassos, mas aparentemente envolvem um enorme volume de reservas venezuelanas passando ao controle dos EUA.\u003c/span\u003e\u003c/p\u003e\n\u003cdiv id=\"code-type\"\u003e\u003cstyle\u003e\n    #om-as33g2wut6dyaarpt96b-holder {\n        display: block;\n        width: 100%;\n        margin: 0 !important;\n        padding: 0 !important;\n        background: transparent !important;\n        border: 0 !important;\n        border-radius: 0 !important;\n        box-shadow: none !important;\n    }\n\n    #om-as33g2wut6dyaarpt96b-holder iframe {\n        display: block;\n        width: 100% !important;\n        margin: 0 !important;\n        padding: 0 !important;\n        background: transparent !important;\n        border: 0 !important;\n        border-radius: 0 !important;\n        box-shadow: none !important;\n    }\n\u003c/style\u003e\n\n\u003cdiv id=\"om-as33g2wut6dyaarpt96b-holder\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp\u003e\u003cspan style=\"font-weight: 400;\"\u003ePor que isso importa para o Brasil? Por um lado, não custa prestar atenção no que se passa no resto da América Latina, e em especial em como o governo Trump se comporta em relação à região. A desfaçatez com que os EUA agora proclamam sua intenção de exercer influência sobre o continente é sem dúvida um péssimo sinal para nós. Em outros tempos era comum acusá-los de hipocrisia, mas, sendo esta o tributo que a imoralidade presta à virtude, \u003c/span\u003e\u003ca href=\"https://www.goodreads.com/quotes/319152-hypocrisy-is-a-tribute-that-vice-pays-to-virtue\"\u003e\u003cspan style=\"font-weight: 400;\"\u003ena famosa frase\u003c/span\u003e\u003c/a\u003e\u003cspan style=\"font-weight: 400;\"\u003e do escritor francês La Rochefoucauld, segue-se que a necessidade de pagar esse imposto acaba por reduzir a oferta de imoralidade.\u003c/span\u003e\u003c/p\u003e\u003c/body\u003e\u003c/html\u003e","createdAt":"02 de setembro de 2026","highlight":"","id":385312,"isFuturePoint":false,"layout":"Colunista","meta":{"authors":[{"name":"Filipe Campante","description":"é Bloomberg Distinguished Associate Professor na Johns Hopkins University. Sua pesquisa enfoca temas de economia política, desenvolvimento e questões urbanas e já foi publicada em periódicos acadêmicos como “American Economic Review” e “Quarterly Journal of Economics”. Nascido no Rio, ele é PhD por Harvard, mestre pela PUC-Rio, e bacharel pela UFRJ, todos em economia. Foi professor em Harvard (2007-18) e professor visitante na PUC-Rio (2011-12).","slug":"filipe-campantenexojornal-com-br","databaseId":189,"avatar":{"url":"https://secure.gravatar.com/avatar/a20d74bb04eefa61fabe4f365c63a8c71802cc52ca8cfb1f2c1353ad1e0445ec?s=96\u0026d=mm\u0026r=g","__typename":"Avatar"},"usersACF":{"avatarImage":{"sourceUrl":"https://nexo-uploads-beta.s3.amazonaws.com/wp-content/uploads/images/2023/12/09105728/colunista_filipecampante-bolinha_binary_178394.png","__typename":"MediaItem"},"__typename":"User_Usersacf"},"__typename":"User"}],"highlight":null,"layout":"Colunista","referenc
