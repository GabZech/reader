{% macro item_row(item, extra=false) %}
        <a class="item{% if item.image_url %} has-thumb{% endif %}{% if extra %} is-more{% endif %}"{% if extra %} hidden{% endif %} href="/items/{{ item.id }}">
          {% if item.image_url %}
          <span class="thumb" aria-hidden="true" style="background-image:url('{{ item.image_url }}')"></span>
          {% endif %}
          <span class="title">{{ item.title }}</span>
          <span class="sub">
            <span class="byline">{{ item.author or item.source_title }}{% if item.published_at %} · {{ format_when(item.published_at) }}{% endif %}</span>
            {% if item.word_count %}
            <span class="length">{{ reading_length(item.word_count) }}</span>
            {% endif %}
          </span>
        </a>
{% endmacro %}
