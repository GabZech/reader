{% extends "base.html" %}
{% block title %}Highlight{% endblock %}
{% block body %}
      <div class="top-bar">
        <a class="top-edit" href="{{ back }}">Close</a>
      </div>
      <header class="top">
        <h1>Highlight</h1>
      </header>
      <section class="list">
        <a class="item" href="{{ section_title_action }}">
          <span class="title">Add section title</span>
          <span class="sub">
            <span class="byline">This highlight and those that follow, until the next title</span>
          </span>
        </a>
        <a class="item" href="{{ subsection_title_action }}">
          <span class="title">Add subsection title</span>
          <span class="sub">
            <span class="byline">Same rule, one level under a section title</span>
          </span>
        </a>
        <form method="post" action="{{ key_action }}">
          <button type="submit" class="item">
            {% if highlight.is_key %}
            <span class="title">Unmark key passage</span>
            <span class="sub">
              <span class="byline">Back to a normal highlight</span>
            </span>
            {% else %}
            <span class="title">Mark as key passage</span>
            <span class="sub">
              <span class="byline">Shows in Obsidian as a yellow mark tagged #key</span>
            </span>
            {% endif %}
          </button>
        </form>
      </section>
      <button type="button" class="btn" id="copy-highlight" data-copy-text="{{ highlight.text }}">Copy text</button>
      <form class="danger-zone" method="post" action="{{ delete_action }}">
        <button type="submit" class="btn btn-danger">Delete highlight</button>
      </form>
      <blockquote class="quote">{{ highlight.text }}</blockquote>
{% endblock %}
