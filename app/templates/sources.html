{% extends "base.html" %}
{% block title %}Sources{% endblock %}
{% block body %}
      <header class="top">
        <h1>Sources</h1>
      </header>

      <section class="list">
        {% for source in sources %}
        <div class="item">
          <span class="title">{{ source.title }}</span>
          <span class="sub">
            <span class="byline">{{ source.kind }}{% if source.list_name %} · {{ source.list_name }}{% endif %}</span>
          </span>
        </div>
        {% endfor %}
      </section>
{% endblock %}
