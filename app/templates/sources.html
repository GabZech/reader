{% extends "base.html" %}
{% block title %}Sources{% endblock %}
{% block body %}
      <header class="top top-row">
        <h1>Sources</h1>
        <a class="top-edit" href="/sources/add">Add source</a>
      </header>

      {% for group in groups %}
      <section class="list{% if not loop.first %} is-apart{% endif %}">
        <div class="list-head">
          <h2>{{ group.label }}</h2>
        </div>
        {% for source in group.sources %}
        <a class="item{% if source.unlisted %} is-unlisted{% endif %}{% if source.pending_notice %} is-new{% endif %}" href="/sources/{{ source.id }}/items">
          <span class="title">{{ source.title }}</span>
          <span class="sub">
            <span class="byline">{{ source.byline }}</span>
          </span>
        </a>
        {% endfor %}
      </section>
      {% endfor %}
{% endblock %}
