{% extends "base.html" %}
{% from "macros.html" import item_row %}
{% block title %}{{ list_name }}{% endblock %}
{% block body %}
      <header class="top top-row">
        <h1>{{ list_name }}</h1>
        <a class="top-edit" href="/lists/{{ slug }}/edit">Edit</a>
      </header>

      <section class="list">
        {% for item in items %}
          {{ item_row(item, list_slug=slug) }}
        {% endfor %}
      </section>
{% endblock %}
