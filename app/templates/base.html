<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17120e" />
    <title>{% block title %}Reader{% endblock %}</title>
    <link rel="preload" href="/static/fonts/literata-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/fonts/fraunces-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/static/fonts/figtree-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <script>
      (() => {
        if (localStorage.getItem("reader-theme") !== "light") {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script>
      // Breadcrumbs for tracing a white screen. Each page notes what it did in
      // the phone's storage and sends the notes to /diagnostics on a later load.
      (() => {
        try {
          const KEY = "reader-log";
          const MAX = 150;
          const rand = () => Math.random().toString(36).slice(2, 7);
          const nav = rand();
          let launch = "";
          try {
            launch = sessionStorage.getItem("reader-launch") || "";
            if (!launch) {
              launch = rand();
              sessionStorage.setItem("reader-launch", launch);
            }
          } catch (_) {}
          const read = () => {
            try {
              return JSON.parse(localStorage.getItem(KEY) || "[]");
            } catch (_) {
              return [];
            }
          };
          const write = (list) => {
            try {
              localStorage.setItem(KEY, JSON.stringify(list.slice(-MAX)));
            } catch (_) {}
          };
          const log = (e, d) => {
            try {
              const list = read();
              const last = list.length ? list[list.length - 1].s : 0;
              const now = Date.now();
              list.push({ s: Math.max(last + 1, now), t: now, e, p: location.pathname, d: d == null ? "" : String(d).slice(0, 160), n: nav, l: launch });
              write(list);
            } catch (_) {}
          };
          let sending = false;
          const flush = () => {
            if (sending || !navigator.onLine) return;
            const batch = read().slice(0, 60);
            if (!batch.length) return;
            sending = true;
            fetch("/diag", { method: "POST", body: JSON.stringify(batch), keepalive: true })
              .then((response) => {
                if (!response.ok) return;
                const sent = new Set(batch.map((x) => x.s));
                write(read().filter((x) => !sent.has(x.s)));
              })
              .catch(() => {})
              .finally(() => {
                sending = false;
              });
          };

          const entry = performance.getEntriesByType("navigation")[0];
          let from = "";
          try {
            from = document.referrer ? new URL(document.referrer).pathname : "";
          } catch (_) {}
          const worker = navigator.serviceWorker && navigator.serviceWorker.controller ? 1 : 0;
          log("start", `${entry ? entry.type : "?"} sw=${worker} from=${from || "-"} ${document.visibilityState}`);
          flush();

          document.addEventListener("DOMContentLoaded", () => log("dcl", `${Math.round(performance.now())}ms`));
          window.addEventListener("load", () => {
            const n = performance.getEntriesByType("navigation")[0];
            log("load", `${Math.round(performance.now())}ms ttfb=${n ? Math.round(n.responseStart) : "?"} resp=${n ? Math.round(n.responseEnd) : "?"}`);
          });
          try {
            new PerformanceObserver((list) =>
              list.getEntries().forEach((p) => log("paint", `${p.name} ${Math.round(p.startTime)}ms`))
            ).observe({ type: "paint", buffered: true });
          } catch (_) {}
          setTimeout(() => {
            const painted = performance.getEntriesByName("first-contentful-paint").length;
            const text = document.body ? document.body.innerText.trim().length : -1;
            log("check", `fcp=${painted} ready=${document.readyState} text=${text} ${document.visibilityState}`);
            flush();
          }, 3000);
          // Where things sit: viewport, safe areas (read through a hidden probe)
          // and the tab bar, at load and while scrolling.
          const geometry = (label) => {
            try {
              const probe = document.createElement("div");
              probe.style.cssText = "position:fixed;top:0;left:0;visibility:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0";
              document.documentElement.appendChild(probe);
              const css = getComputedStyle(probe);
              const safe = `${css.paddingTop}/${css.paddingBottom}`;
              probe.remove();
              const view = window.visualViewport;
              const bar = document.querySelector(".tabbar");
              const scroller = document.querySelector(".scroller");
              const box = bar ? bar.getBoundingClientRect() : null;
              log(
                "geo",
                [
                  label,
                  `ih=${innerHeight}`,
                  `sh=${screen.height}`,
                  view ? `vv=${Math.round(view.height)}+${Math.round(view.offsetTop)}` : "vv=?",
                  `y=${Math.round(scroller ? scroller.scrollTop : scrollY)}`,
                  `safe=${safe}`,
                  box ? `bar=${Math.round(box.top)}-${Math.round(box.bottom)}` : "bar=-",
                  `standalone=${matchMedia("(display-mode: standalone)").matches ? 1 : 0}`,
                ].join(" ")
              );
            } catch (_) {}
          };
          let geoCount = 0;
          let geoAt = 0;
          let geoTimer = 0;
          window.addEventListener("load", () => setTimeout(() => geometry("load"), 400));
          document.addEventListener(
            "scroll",
            () => {
              if (geoCount < 30 && Date.now() - geoAt > 250) {
                geoAt = Date.now();
                geoCount += 1;
                geometry("scroll");
              }
              clearTimeout(geoTimer);
              geoTimer = setTimeout(() => {
                if (geoCount < 30) {
                  geoCount += 1;
                  geometry("scroll-end");
                }
              }, 400);
            },
            { passive: true, capture: true }
          );
          window.addEventListener("error", (ev) => log("error", `${ev.message} ${ev.filename ? ev.filename.split("/").pop() : ""}:${ev.lineno}`));
          window.addEventListener("unhandledrejection", (ev) => log("rejection", ev.reason && ev.reason.message ? ev.reason.message : ev.reason));
          window.addEventListener("pageshow", (ev) => log("pageshow", ev.persisted ? "from-cache" : "fresh"));
          window.addEventListener("pagehide", (ev) => {
            log("pagehide", ev.persisted ? "to-cache" : "gone");
            flush();
          });
          document.addEventListener("visibilitychange", () => {
            log("vis", document.visibilityState);
            if (document.visibilityState === "hidden") flush();
          });
          document.addEventListener(
            "click",
            (ev) => {
              const link = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
              if (link) log("tap", link.getAttribute("href"));
            },
            true
          );
          if (navigator.serviceWorker) {
            navigator.serviceWorker.addEventListener("message", (ev) => {
              if (ev.data && ev.data.type === "log") log(ev.data.e, ev.data.d);
            });
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div class="scroller">
      <div class="page">
        {% block body %}{% endblock %}
      </div>
    </div>
    {% if flash %}
    <div class="toast" role="status">{{ flash }}</div>
    {% endif %}
    <nav class="tabbar" aria-label="Main">
      <a class="tab{% if nav == 'home' %} is-active{% endif %}" href="/"{% if nav == 'home' %} aria-current="page"{% endif %}><span class="tab-label">Home</span></a>
      <a class="tab{% if nav == 'lists' %} is-active{% endif %}" href="/lists"{% if nav == 'lists' %} aria-current="page"{% endif %}><span class="tab-label">Lists</span></a>
      <a class="tab{% if nav == 'sources' %} is-active{% endif %}" href="/sources"{% if nav == 'sources' %} aria-current="page"{% endif %}><span class="tab-label">Sources{% if sources_notice_pending() %}<span class="dot" aria-hidden="true"></span>{% endif %}</span></a>
    </nav>
    <script src="/static/app.js"></script>
  </body>
</html>
