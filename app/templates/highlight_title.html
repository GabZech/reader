{% extends "base.html" %}
{% block title %}{{ label }}{% endblock %}
{% block body %}
      <div class="top-bar">
        <a class="top-edit" href="{{ back }}">Close</a>
      </div>
      <header class="top">
        <h1>{{ label }}</h1>
      </header>
      <blockquote class="quote">{{ text }}</blockquote>
      <form method="post" action="{{ save_action }}">
        <label class="field-label" for="highlight-title">Title</label>
        <div class="field-row">
          <input id="highlight-title" type="text" name="title" autocomplete="off" value="{{ title }}">
          <button type="submit">Done</button>
        </div>
      </form>
{% endblock %}
