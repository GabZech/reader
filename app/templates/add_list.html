{% extends "base.html" %}
{% block title %}Add list{% endblock %}
{% block body %}
      <header class="top">
        <a class="back" href="{{ back_href }}">{{ "List" if hidden else "Lists" }}</a>
        <h1>Add list</h1>
      </header>
      {% if not error %}
      <p class="lede">Name this list.</p>
      {% endif %}
      <form method="post" action="{{ form_action }}">
        {% for key, value in hidden.items() %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endfor %}
        <label class="field-label" for="list-name">Name</label>
        <input class="field{% if error %} is-error{% endif %}" id="list-name" name="name" type="text" autocomplete="off" value="{{ name }}" required{% if error %} aria-describedby="list-name-error"{% endif %}>
        {% if error %}
        <p class="field-error" id="list-name-error">{{ error }}</p>
        {% endif %}
        <button class="btn btn-accent" type="submit">Continue</button>
      </form>
{% endblock %}
